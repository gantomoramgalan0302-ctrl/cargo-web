services:
  # ── Backend (Web Service) ──────────────────────────────────────
  - type: web
    name: narlag-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URL
        sync: false          # Render dashboard-аас гараар оруулна
      - key: JWT_SECRET
        sync: false          # Render dashboard-аас гараар оруулна
      - key: CORS_ORIGIN
        sync: false          # Frontend URL (deploy болсны дараа оруулна)

  # ── Frontend (Static Site) ────────────────────────────────────
  - type: web
    name: narlag-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Backend URL (deploy болсны дараа оруулна)
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
